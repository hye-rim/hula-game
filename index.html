<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>훌라</title>
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#06140c;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(0,0,0,.82); }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:46px; font-weight:900; letter-spacing:.06em; color:#ff9ac8; text-shadow:0 3px 0 #8a1a4a; }
  #overlay h2 { font-size:24px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay .big { font-size:18px; font-weight:800; color:#ffd23a; }
  #overlay .help { font-size:12px; color:#bdbdbd; line-height:1.7; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#ffd0e6,#e85aa0); color:#2a0014; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #8a1a4a; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #8a1a4a; }
  #top { position:absolute; right:3px; top:2px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:30px; height:30px; border-radius:8px; font-size:13px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  /* 조작판: 위 줄(뽑기·땡큐·스톱) / 아래 줄(등록·붙이기·버리기·정렬) */
  #controls { display:flex; width:100%; max-width:420px; flex-direction:column; justify-content:center; gap:6px; height:114px; }
  #controls .row { display:flex; gap:6px; justify-content:center; }
  #controls button { flex:1; height:50px; border-radius:14px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff; font-size:14px; font-weight:800; touch-action:manipulation; }
  #controls button small { display:block; font-size:10px; font-weight:600; opacity:.8; }
  #controls button:disabled { opacity:.3; }
  #btnDraw { background:linear-gradient(180deg,#9ac8ff,#2a6ac4); }
  #btnThank { background:linear-gradient(180deg,#ffd98a,#d89a2a); color:#2a1a00; }
  #btnStop { background:linear-gradient(180deg,#e88a8a,#b03a3a); }
  #btnReg { background:linear-gradient(180deg,#8ae8a8,#2a9a52); }
  #btnAttach { background:linear-gradient(180deg,#c8a0ff,#7a4ac4); }
  #btnDiscard { background:linear-gradient(180deg,#ffb08a,#d85a2a); }
  #btnSort { flex:.7; }
  .pc { display:inline; } .touch { display:none; }
  @media (pointer:coarse) { .pc { display:none; } .touch { display:inline; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>훌라</h1>
      <p>카드를 모아 <b>등록</b>하고 손패를 먼저 털어요! 🃏<br>컴퓨터 세 명과 5판 승부, 점수는 게임용이에요</p>
      <div class="help">
        <span class="pc">⌨️ D 뽑기 · T 땡큐 · S 스톱 · R 등록 · A 붙이기 · X 버리기 · 카드를 눌러 고르기</span>
        <span class="touch">👆 카드를 눌러 고르고 아래 버튼을 눌러요</span>
      </div>
      <button id="startBtn">시작하기</button>
    </div>
  </div>
  <div id="controls">
    <div class="row"><button id="btnDraw">더미<small>뽑기</small></button><button id="btnThank">땡큐<small>버린 카드</small></button><button id="btnStop">스톱</button></div>
    <div class="row"><button id="btnReg">등록</button><button id="btnAttach">붙이기</button><button id="btnDiscard">버리기</button><button id="btnSort">정렬</button></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
